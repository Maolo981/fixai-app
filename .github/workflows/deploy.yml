# Pubblica Confetto su Cloudflare con un clic: GitHub → Actions → "Deploy" → Run workflow.
# Prima aggiungi in Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   (token con permessi "Edit Cloudflare Workers" + D1)
#   CLOUDFLARE_ACCOUNT_ID
name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy worker
        run: npx wrangler deploy
