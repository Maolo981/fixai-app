[project]
name = "terrascan-backend"
version = "0.1.0"
description = "TerraScan Italia - servizio di analisi geografiche (Fase 1: superficie e perimetro)"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyproj>=3.6",
    "shapely>=2.0",
    "httpx>=0.27",
    "rasterio>=1.4",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyshp>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
